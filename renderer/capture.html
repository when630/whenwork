<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>퀵캡처</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* 라운드·그림자는 Win11 네이티브에 맡긴다 */
  html, body { background: var(--bg-raised); overflow: hidden; height: 100%; }
  .capture { width: 100%; height: 100%; display: flex; flex-direction: column; }
  .row { flex: 1; display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-4) 18px; }
  .logo {
    width: 26px; height: 26px; flex: none; border-radius: var(--r-sm);
    background: var(--accent-dim); color: var(--accent);
    display: grid; place-items: center;
    font-family: var(--font-mono); font-weight: 700; font-size: 13px;
    transition: background .15s, color .15s;
  }
  body.flash .logo { background: rgba(158,206,106,.16); color: var(--success); }
  input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text-primary); font-family: var(--font-sans); font-size: var(--fs-lg);
  }
  input::placeholder { color: var(--text-muted); }
  .foot {
    display: flex; justify-content: space-between; align-items: center; gap: var(--sp-3);
    padding: var(--sp-2) 18px; border-top: 1px solid var(--border);
    font-size: var(--fs-xs); color: var(--text-muted);
    background: var(--bg-app);
  }
  .hints { display: flex; gap: var(--sp-3); flex: none; }
  .msg { text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msg.ok { color: var(--success); }
  .msg.warn { color: var(--warning); }
</style>
</head>
<body>
  <div class="capture">
    <div class="row">
      <div class="logo" id="logo">W</div>
      <input id="in" type="text" placeholder="할 일을 한 줄로… (분류는 나중에)" maxlength="500">
    </div>
    <div class="foot">
      <div class="hints">
        <span><kbd>Enter</kbd> 저장</span>
        <span><kbd>Tab</kbd> 앱 열기</span>
        <span><kbd>Esc</kbd> 닫기</span>
      </div>
      <span class="msg" id="msg"></span>
    </div>
  </div>
<script src="icons.js"></script>
<script src="capture.js"></script>
</body>
</html>
