<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>WHENWORK</title>
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg-app);
    display: flex; flex-direction: column;
    border: 1px solid var(--border); border-radius: var(--r-lg);
  }
  header { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4) 0; -webkit-app-region: drag; }
  header .title { font-weight: 700; font-size: var(--fs-md); }
  header .date { color: var(--text-muted); font-size: var(--fs-xs); margin-left: auto; }

  .tabs { display: flex; gap: var(--sp-1); padding: var(--sp-2) var(--sp-3) 0; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 6px 10px 8px; font-size: var(--fs-sm); color: var(--text-secondary);
    border-radius: var(--r-sm) var(--r-sm) 0 0; cursor: pointer;
    border-bottom: 2px solid transparent; display: flex; gap: 6px; align-items: center;
  }
  .tab .n { font-size: 10px; font-family: var(--font-mono); background: var(--bg-inset); border-radius: 99px; padding: 0 6px; }
  .tab.on { color: var(--text-primary); border-bottom-color: var(--accent); }
  .tab:hover:not(.on) { background: var(--bg-hover); }

  .body { flex: 1; overflow-y: auto; padding: var(--sp-2) 0; outline: none; }

  .group-h { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-4) var(--sp-1); font-size: var(--fs-xs); color: var(--text-muted); }
  .item { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--sp-2); padding: 7px var(--sp-4); cursor: pointer; }
  .item:hover { background: var(--bg-hover); }
  .item.selected { background: var(--accent-dim); box-shadow: inset 2px 0 0 var(--accent); }
  .cb { width: 15px; height: 15px; flex: none; margin-top: 3px; border: 1.5px solid var(--text-muted); border-radius: 4px; position: relative; }
  .item.done .cb { background: var(--success); border-color: var(--success); }
  .item.done .cb::after { content: "✓"; position: absolute; inset: -3px 0 0 2px; font-size: 11px; color: #16171c; }
  .item.done .t { color: var(--text-muted); text-decoration: line-through; }
  .item .t { flex: 1; font-size: var(--fs-md); }
  .item .meta { display: flex; gap: 6px; align-items: center; flex: none; margin-top: 1px; }
  .due { font-size: var(--fs-xs); font-family: var(--font-mono); color: var(--text-muted); }
  .due.today { color: var(--warning); }
  .due.over { color: var(--danger); }
  .ctx { width: 100%; font-size: var(--fs-xs); color: var(--text-muted); margin-left: 23px; }
  .wait-meta { width: 100%; font-size: var(--fs-xs); color: var(--text-muted); margin-left: 23px; }
  .elapsed { font-family: var(--font-mono); }
  .elapsed.hot { color: var(--danger); }

  .numlegend {
    margin-top: var(--sp-2); padding: var(--sp-2) var(--sp-4);
    border-top: 1px dashed var(--border);
    font-size: var(--fs-xs); color: var(--text-muted);
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .numlegend b { font-family: var(--font-mono); color: var(--text-secondary); }

  .empty {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: var(--sp-2);
    color: var(--text-muted); font-size: var(--fs-sm); text-align: center;
  }
  .empty .big { font-size: 28px; opacity: .5; }

  footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: var(--sp-2) var(--sp-4); border-top: 1px solid var(--border);
    font-size: var(--fs-xs); color: var(--text-muted);
  }
  .sync { display: flex; align-items: center; gap: 5px; }
  .sync .led { width: 7px; height: 7px; border-radius: 99px; background: var(--success); }
  .sync.off .led { background: var(--warning); }
  .foot-hints { display: flex; gap: var(--sp-3); }

  /* ── 재개 카드 (M2, 목업 03) */
  .rhead { display: flex; align-items: center; gap: var(--sp-2); padding: var(--sp-2) var(--sp-4); border-bottom: 1px solid var(--border); }
  .rhead .back { color: var(--text-muted); cursor: pointer; font-size: var(--fs-lg); }
  .rhead .pname { font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .rhead .pname .dot { width: 9px; height: 9px; border-radius: 99px; }
  .rhead .gen-at { margin-left: auto; font-size: var(--fs-xs); color: var(--text-muted); }
  .rbody { padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-4); }
  .badge-ai {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: var(--fs-xs); color: var(--ai);
    background: var(--ai-dim); border-radius: 4px; padding: 1px 6px;
  }
  .card {
    background: var(--bg-raised); border: 1px solid var(--border);
    border-radius: var(--r-md); padding: var(--sp-4);
    display: flex; flex-direction: column; gap: var(--sp-3);
  }
  .card .h { font-size: var(--fs-xs); color: var(--text-muted); letter-spacing: .06em; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
  .card .v { font-size: var(--fs-md); }
  .next { background: var(--accent-dim); border-radius: var(--r-sm); padding: var(--sp-2) var(--sp-3); display: flex; gap: var(--sp-2); align-items: baseline; }
  .next .arrow { color: var(--accent); font-weight: 700; flex: none; }
  .sec-h { font-size: var(--fs-xs); color: var(--text-muted); letter-spacing: .06em; margin-bottom: var(--sp-2); }
  .commit { display: flex; gap: var(--sp-2); align-items: baseline; font-family: var(--font-mono); font-size: var(--fs-xs); padding: 3px 0; color: var(--text-secondary); }
  .commit .sha { color: var(--warning); flex: none; }
  .commit .when { color: var(--text-muted); margin-left: auto; flex: none; }
  .issue { display: flex; gap: var(--sp-2); align-items: baseline; font-size: var(--fs-sm); padding: 4px var(--sp-1); color: var(--text-secondary); cursor: pointer; border-radius: var(--r-sm); }
  .issue.selected { background: var(--accent-dim); box-shadow: inset 2px 0 0 var(--accent); }
  .issue .st { width: 8px; height: 8px; border-radius: 99px; flex: none; align-self: center; background: var(--text-muted); }
  .issue .st.open { background: var(--success); }
  .issue .prov { font-family: var(--font-mono); font-size: 10px; flex: none; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; color: var(--text-muted); }
  .issue .num { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-muted); flex: none; }
  .issue .tt { flex: 1; color: var(--text-primary); }
  .issue .asg { flex: none; font-size: 10px; color: var(--warning); background: rgba(224,175,104,.12); border-radius: 4px; padding: 0 5px; }
  .issue .when { color: var(--text-muted); font-size: var(--fs-xs); flex: none; }
  .sync-note { font-size: var(--fs-xs); color: var(--text-muted); margin-top: 4px; }
  .gen-status { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--ai); }
  .spin { width: 12px; height: 12px; border: 2px solid var(--ai-dim); border-top-color: var(--ai); border-radius: 99px; animation: rot .8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .skeleton { display: flex; flex-direction: column; gap: 10px; }
  .sk { height: 12px; border-radius: 4px; background: linear-gradient(90deg, var(--bg-inset) 25%, var(--bg-hover) 50%, var(--bg-inset) 75%); background-size: 200% 100%; animation: shim 1.4s infinite; }
  @keyframes shim { to { background-position: -200% 0; } }
  .err { background: rgba(247,118,142,.08); border: 1px solid rgba(247,118,142,.35); border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); font-size: var(--fs-sm); color: var(--text-secondary); }
  .err .t { color: var(--danger); font-weight: 600; }

  /* 한 줄 텍스트 입력 다이얼로그 (대기 대상·프로젝트 이름·리포 경로 등 공용) */
  #dlg {
    display: none; position: fixed; left: 50%; top: 40%; transform: translateX(-50%);
    width: 420px; background: var(--bg-raised); border: 1px solid var(--border-focus);
    border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4);
    box-shadow: 0 8px 32px rgba(0,0,0,.55);
  }
  #dlg.show { display: block; }
  #dlg label { font-size: var(--fs-xs); color: var(--text-muted); display: block; margin-bottom: 4px; }
  #dlg input {
    width: 100%; background: var(--bg-inset); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 6px 10px; color: var(--text-primary);
    font-family: var(--font-sans); font-size: var(--fs-md); outline: none;
  }
  .proj-repos { width: 100%; font-size: var(--fs-xs); color: var(--text-muted); margin-left: 23px; font-family: var(--font-mono); }
  .proj-num { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-secondary); flex: none; width: 14px; text-align: right; margin-top: 3px; }
</style>
</head>
<body>
  <header><span class="title">WHENWORK</span><span class="date" id="date"></span></header>
  <div class="tabs" id="tabs"></div>
  <div class="body" id="body" tabindex="-1"></div>
  <footer>
    <span class="sync" id="sync"><span class="led"></span><span id="syncText">동기화됨</span></span>
    <span class="foot-hints" id="hints"></span>
  </footer>
  <div id="dlg">
    <label id="dlgLabel"></label>
    <input id="dlgIn" type="text" maxlength="500">
  </div>
<script src="today.js"></script>
</body>
</html>
