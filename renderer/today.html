<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>WHENWORK</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* 라운드·그림자는 Win11 네이티브(프레임리스 기본)에 맡긴다 — CSS 섀도 없음 */
  html, body { height: 100%; overflow: hidden; background: var(--bg-app); }
  .app {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── 상단 바: 타이틀 · 탭 · 날짜를 한 줄로 */
  header {
    display: flex; align-items: center; gap: var(--sp-4);
    padding: var(--sp-3) var(--sp-5);
    border-bottom: 1px solid var(--border);
    -webkit-app-region: drag; flex: none;
  }
  header .title {
    font-weight: 700; font-size: var(--fs-md); letter-spacing: .04em;
    display: flex; align-items: center; gap: 8px;
  }
  header .title::before {
    content: "W"; width: 22px; height: 22px; border-radius: var(--r-sm);
    background: var(--accent-dim); color: var(--accent);
    display: grid; place-items: center;
    font-family: var(--font-mono); font-size: 12px;
  }
  header .date { color: var(--text-muted); font-size: var(--fs-xs); margin-left: auto; }

  .tabs { display: flex; gap: 2px; -webkit-app-region: no-drag; }
  .tab {
    padding: 5px 12px; font-size: var(--fs-sm); color: var(--text-secondary);
    border-radius: var(--r-sm); cursor: pointer;
    display: flex; gap: 7px; align-items: center;
    transition: background .1s, color .1s;
  }
  .tab .n {
    font-size: 10px; font-family: var(--font-mono);
    background: var(--bg-inset); border-radius: 99px; padding: 0 6px;
    color: var(--text-muted); min-width: 18px; text-align: center;
  }
  .tab.on { color: var(--text-primary); background: var(--bg-hover); }
  .tab.on .n { background: var(--accent-dim); color: var(--accent); }
  .tab:hover:not(.on) { background: var(--bg-raised); }

  /* ── 본문: 넓은 창에서도 줄이 늘어지지 않게 좌우 패딩으로 760px 중앙 제한 */
  .body {
    flex: 1; overflow-y: auto; outline: none;
    padding: var(--sp-3) max(var(--sp-3), calc((100% - 760px) / 2)) var(--sp-4);
  }

  .group-h {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: var(--sp-3) var(--sp-4) var(--sp-1);
    font-size: var(--fs-xs); color: var(--text-muted);
  }
  .group-h::after { content: ""; flex: 1; height: 1px; background: var(--border); opacity: .6; }

  .item {
    display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--sp-2);
    padding: 9px var(--sp-3); margin: 1px var(--sp-2);
    border-radius: var(--r-sm); cursor: pointer;
    transition: background .1s;
  }
  .item:hover { background: var(--bg-raised); }
  .item.selected { background: var(--accent-dim); box-shadow: inset 2px 0 0 var(--accent); }
  .cb {
    width: 15px; height: 15px; flex: none; margin-top: 4px;
    border: 1.5px solid var(--text-muted); border-radius: 5px; position: relative;
    transition: background .1s, border-color .1s;
  }
  .item.done .cb { background: var(--success); border-color: var(--success); }
  .item.done .cb::after { content: "✓"; position: absolute; inset: -3px 0 0 2px; font-size: 11px; color: #16171c; }
  .item.done .t { color: var(--text-muted); text-decoration: line-through; }
  .item .t { flex: 1; font-size: var(--fs-md); }
  .item .meta { display: flex; gap: 6px; align-items: center; flex: none; margin-top: 2px; }
  .due {
    font-size: 11px; font-family: var(--font-mono); color: var(--text-muted);
    background: var(--bg-inset); border-radius: 99px; padding: 1px 8px;
  }
  .due.today { color: var(--warning); background: rgba(224,175,104,.1); }
  .due.over { color: var(--danger); background: rgba(247,118,142,.1); }
  .ctx, .wait-meta { width: 100%; font-size: var(--fs-xs); color: var(--text-muted); margin-left: 23px; }
  .elapsed { font-family: var(--font-mono); }
  .elapsed.hot { color: var(--danger); }

  .numlegend {
    margin-top: var(--sp-3); padding: var(--sp-2) var(--sp-4) 0;
    border-top: 1px dashed var(--border);
    font-size: var(--fs-xs); color: var(--text-muted);
    display: flex; gap: 12px; flex-wrap: wrap;
  }
  .numlegend b { font-family: var(--font-mono); color: var(--text-secondary); }

  /* 프로젝트 탭 */
  .proj-num { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-muted); flex: none; width: 14px; text-align: right; margin-top: 3px; }
  .proj-repos { width: 100%; font-size: var(--fs-xs); color: var(--text-muted); margin-left: 22px; font-family: var(--font-mono); }

  .empty {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: var(--sp-2);
    color: var(--text-muted); font-size: var(--fs-sm); text-align: center;
  }
  .empty .big { font-size: 34px; opacity: .35; margin-bottom: var(--sp-1); }

  /* ── 하단 바 */
  footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: var(--sp-2) var(--sp-5);
    border-top: 1px solid var(--border);
    font-size: var(--fs-xs); color: var(--text-muted); flex: none;
  }
  .sync { display: flex; align-items: center; gap: 6px; }
  .sync .led { width: 7px; height: 7px; border-radius: 99px; background: var(--success); box-shadow: 0 0 6px rgba(158,206,106,.6); }
  .sync.off .led { background: var(--warning); box-shadow: 0 0 6px rgba(224,175,104,.6); }
  .foot-hints { display: flex; gap: var(--sp-4); }

  /* ── 재개 카드 */
  .rhead {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: var(--sp-2) 0 var(--sp-3);
  }
  .rhead .back {
    color: var(--text-muted); cursor: pointer; font-size: 18px; line-height: 1;
    width: 26px; height: 26px; border-radius: var(--r-sm);
    display: grid; place-items: center; transition: background .1s;
  }
  .rhead .back:hover { background: var(--bg-hover); color: var(--text-primary); }
  .rhead .pname { font-weight: 700; font-size: var(--fs-lg); display: flex; align-items: center; gap: 9px; }
  .rhead .pname .dot { width: 9px; height: 9px; border-radius: 99px; }
  .rhead .gen-at { margin-left: auto; font-size: var(--fs-xs); color: var(--text-muted); }
  .rbody { display: flex; flex-direction: column; gap: var(--sp-4); }
  .badge-ai {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--ai);
    background: var(--ai-dim); border-radius: 4px; padding: 0 6px;
  }
  .card {
    background: var(--bg-raised); border: 1px solid var(--border);
    border-radius: var(--r-md); padding: var(--sp-4) var(--sp-4);
    display: flex; flex-direction: column; gap: var(--sp-3);
  }
  .card .h {
    font-size: 11px; color: var(--text-muted); letter-spacing: .08em;
    margin-bottom: 4px; display: flex; align-items: center; gap: 6px;
  }
  .card .v { font-size: var(--fs-md); }
  .next {
    background: var(--accent-dim); border-radius: var(--r-sm);
    padding: var(--sp-2) var(--sp-3);
    display: flex; gap: var(--sp-2); align-items: baseline;
  }
  .next .arrow { color: var(--accent); font-weight: 700; flex: none; }
  .sec-h { font-size: 11px; color: var(--text-muted); letter-spacing: .08em; margin-bottom: var(--sp-2); }
  .commit {
    display: flex; gap: var(--sp-2); align-items: baseline;
    font-family: var(--font-mono); font-size: var(--fs-xs);
    padding: 3px 0; color: var(--text-secondary);
  }
  .commit .sha { color: var(--warning); flex: none; }
  .commit .when { color: var(--text-muted); margin-left: auto; flex: none; padding-left: var(--sp-3); }
  .issue {
    display: flex; gap: var(--sp-2); align-items: baseline;
    font-size: var(--fs-sm); padding: 5px var(--sp-2); margin: 0 calc(-1 * var(--sp-2));
    color: var(--text-secondary); cursor: pointer; border-radius: var(--r-sm);
    transition: background .1s;
  }
  .issue:hover { background: var(--bg-raised); }
  .issue.selected { background: var(--accent-dim); box-shadow: inset 2px 0 0 var(--accent); }
  .issue .st { width: 8px; height: 8px; border-radius: 99px; flex: none; align-self: center; background: var(--text-muted); }
  .issue .st.open { background: var(--success); }
  .issue .prov { font-family: var(--font-mono); font-size: 10px; flex: none; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; color: var(--text-muted); }
  .issue .num { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-muted); flex: none; }
  .issue .tt { flex: 1; color: var(--text-primary); }
  .issue .asg { flex: none; font-size: 10px; color: var(--warning); background: rgba(224,175,104,.12); border-radius: 4px; padding: 0 5px; }
  .issue .when { color: var(--text-muted); font-size: var(--fs-xs); flex: none; }
  .sync-note { font-size: var(--fs-xs); color: var(--text-muted); margin-top: 6px; }
  .gen-status { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--ai); }
  .spin { width: 12px; height: 12px; border: 2px solid var(--ai-dim); border-top-color: var(--ai); border-radius: 99px; animation: rot .8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .skeleton { display: flex; flex-direction: column; gap: 10px; }
  .sk { height: 12px; border-radius: 4px; background: linear-gradient(90deg, var(--bg-inset) 25%, var(--bg-hover) 50%, var(--bg-inset) 75%); background-size: 200% 100%; animation: shim 1.4s infinite; }
  @keyframes shim { to { background-position: -200% 0; } }
  .err { background: rgba(247,118,142,.08); border: 1px solid rgba(247,118,142,.35); border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); font-size: var(--fs-sm); color: var(--text-secondary); }
  .err .t { color: var(--danger); font-weight: 600; margin-bottom: 2px; }

  /* ── 입력 다이얼로그 (공용) */
  #dlg {
    display: none; position: fixed; left: 50%; top: 38%; transform: translateX(-50%);
    width: 440px; background: var(--bg-raised); border: 1px solid var(--border-focus);
    border-radius: var(--r-md); padding: var(--sp-4);
    box-shadow: var(--shadow-pop); z-index: 10;
  }
  #dlg.show { display: block; }
  #dlg label { font-size: var(--fs-xs); color: var(--text-muted); display: block; margin-bottom: 6px; }
  #dlg input {
    width: 100%; background: var(--bg-inset); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 7px 11px; color: var(--text-primary);
    font-family: var(--font-sans); font-size: var(--fs-md); outline: none;
  }
  #dlg input:focus { border-color: var(--border-focus); }
</style>
</head>
<body>
  <div class="app">
    <header>
      <span class="title">WHENWORK</span>
      <nav class="tabs" id="tabs"></nav>
      <span class="date" id="date"></span>
    </header>
    <div class="body" id="body" tabindex="-1"></div>
    <footer>
      <span class="sync" id="sync"><span class="led"></span><span id="syncText">동기화됨</span></span>
      <span class="foot-hints" id="hints"></span>
    </footer>
  </div>
  <div id="dlg">
    <label id="dlgLabel"></label>
    <input id="dlgIn" type="text" maxlength="500">
  </div>
<script src="icons.js"></script>
<script src="today.js"></script>
</body>
</html>
