<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>WHENWORK</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* 라운드·그림자는 Win11 네이티브(프레임리스 기본)에 맡긴다 — CSS 섀도 없음 */
  html, body { height: 100%; overflow: hidden; background: var(--bg-app); }
  .app {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── 상단 바: 타이틀 · 탭 · 날짜를 한 줄로 */
  header {
    display: flex; align-items: center; gap: var(--sp-4);
    padding: var(--sp-3) var(--sp-5);
    border-bottom: 1px solid var(--border);
    -webkit-app-region: drag; flex: none;
  }
  header .title {
    font-weight: 700; font-size: var(--fs-md); letter-spacing: .04em;
    display: flex; align-items: center; gap: 8px;
  }
  header .title::before {
    content: "W"; width: 22px; height: 22px; border-radius: var(--r-sm);
    background: var(--accent-dim); color: var(--accent);
    display: grid; place-items: center;
    font-family: var(--font-mono); font-size: 12px;
  }
  header .date { color: var(--text-muted); font-size: var(--fs-xs); margin-left: auto; }

  .tabs { display: flex; gap: 2px; -webkit-app-region: no-drag; }
  .tab {
    padding: 5px 12px; font-size: var(--fs-sm); color: var(--text-secondary);
    border-radius: var(--r-sm); cursor: pointer;
    display: flex; gap: 7px; align-items: center;
    transition: background .1s, color .1s;
  }
  .tab .n {
    font-size: 10px; font-family: var(--font-mono);
    background: var(--bg-inset); border-radius: 99px; padding: 0 6px;
    color: var(--text-muted); min-width: 18px; text-align: center;
  }
  .tab.on { color: var(--text-primary); background: var(--bg-hover); }
  .tab.on .n { background: var(--accent-dim); color: var(--accent); }
  .tab:hover:not(.on) { background: var(--bg-raised); }

  /* ── 서브탭: 이슈 탭 안에서 프로젝트를 오간다(←→). 상위 탭과 섞이지 않게 더 작고 납작하게 */
  .subtabs { display: none; gap: 3px; padding: 7px 14px 0; align-items: center; }
  .subtabs.show { display: flex; }
  .subtab {
    padding: 3px 9px; font-size: var(--fs-xs); color: var(--text-muted);
    border-radius: 99px; cursor: pointer; display: flex; gap: 5px; align-items: center;
    border: 1px solid transparent; transition: background .1s, color .1s, border-color .1s;
  }
  .subtab .n { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); opacity: .8; }
  /* 최근 커밋이 난 프로젝트는 이름 앞이 아니라 색으로 드러낸다 — 「지금」과 중복해 읽히지 않게 */
  .subtab.hot { color: var(--text-secondary); }
  .subtab.on {
    color: var(--text-primary); background: var(--bg-hover); border-color: var(--border);
  }
  .subtab.on .n { color: var(--accent); opacity: 1; }
  .subtab:hover:not(.on) { background: var(--bg-raised); }

  /* ── 검색 바: 필터가 걸려 있는 동안은 흐리게 남아 상태를 드러낸다 */
  .search {
    display: none; align-items: center; gap: var(--sp-2); flex: none;
    padding: 6px var(--sp-5); border-bottom: 1px solid var(--border);
    background: var(--bg-raised);
  }
  .search.show { display: flex; }
  .search.idle { opacity: .55; }
  .search .ico { font-family: var(--font-mono); color: var(--accent); }
  .search input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text-primary); font-family: var(--font-sans); font-size: var(--fs-md);
  }
  .search .cnt { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-muted); }

  /* ── 본문: 넓은 창에서도 줄이 늘어지지 않게 좌우 패딩으로 760px 중앙 제한 */
  .body {
    /* 내용 길이에 따라 스크롤바가 생겼다 없어지면 폭이 10px 흔들려 화면이 들썩인다 —
       자리를 늘 비워 둔다 */
    flex: 1; overflow-y: auto; scrollbar-gutter: stable; outline: none;
    padding: var(--sp-3) max(var(--sp-3), calc((100% - 760px) / 2)) var(--sp-4);
  }

  .group-h {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: var(--sp-3) var(--sp-4) var(--sp-1);
    font-size: var(--fs-xs); color: var(--text-muted);
  }
  .group-h::after { content: ""; flex: 1; height: 1px; background: var(--border); opacity: .6; }

  /* ── 완료 기록 (H) */
  .hist-day {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: var(--sp-4) var(--sp-4) var(--sp-1);
    font-size: var(--fs-sm); color: var(--text-secondary); font-weight: 700;
  }
  .hist-day .n { font-family: var(--font-mono); font-size: 10px; font-weight: 400; color: var(--text-muted); }
  .hist-day::after { content: ""; flex: 1; height: 1px; background: var(--border); opacity: .6; }
  .hist-row {
    display: flex; gap: var(--sp-2); align-items: baseline;
    padding: 3px var(--sp-4); font-size: var(--fs-sm); color: var(--text-secondary);
  }
  .hist-row .mark { flex: none; width: 14px; text-align: center; color: var(--success); }
  .hist-row.commit-row { font-family: var(--font-mono); font-size: var(--fs-xs); }
  .hist-row.commit-row .mark { color: var(--warning); }
  .hist-row .tt { flex: 1; }
  .hist-row .p { flex: none; font-size: var(--fs-xs); color: var(--text-muted); }
  .hist-row .when { flex: none; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }

  .item {
    display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--sp-2);
    padding: 9px var(--sp-3); margin: 1px var(--sp-2);
    border-radius: var(--r-sm); cursor: pointer;
    transition: background .1s;
  }
  .item:hover { background: var(--bg-raised); }
  .item.selected { background: var(--accent-dim); box-shadow: inset 2px 0 0 var(--accent); }
  .cb {
    width: 15px; height: 15px; flex: none; margin-top: 4px;
    border: 1.5px solid var(--text-muted); border-radius: 5px; position: relative;
    transition: background .1s, border-color .1s;
  }
  /* 눌러도 되게 생긴 것은 실제로 눌린다 (키보드는 Space) */
  .cb:hover { border-color: var(--success); }
  .item.done .cb { background: var(--success); border-color: var(--success); }
  .item.done .cb::after { content: "✓"; position: absolute; inset: -3px 0 0 2px; font-size: 11px; color: #16171c; }
  .item.done .t { color: var(--text-muted); text-decoration: line-through; }
  .item .t { flex: 1; font-size: var(--fs-md); }
  .item .meta { display: flex; gap: 6px; align-items: center; flex: none; margin-top: 2px; }
  .due {
    font-size: 11px; font-family: var(--font-mono); color: var(--text-muted);
    background: var(--bg-inset); border-radius: 99px; padding: 1px 8px;
  }
  .due.today { color: var(--warning); background: rgba(224,175,104,.1); }
  .due.over { color: var(--danger); background: rgba(247,118,142,.1); }
  /* 이슈에서 세운 할 일 — 원본이 닫히면 색이 바뀌어 "이제 체크해도 된다"를 알린다 */
  .isu {
    font-size: 11px; font-family: var(--font-mono); cursor: pointer;
    color: var(--text-secondary); background: var(--bg-inset);
    border-radius: 99px; padding: 1px 8px;
  }
  .isu:hover { color: var(--accent); }
  .isu.closed { color: var(--success); background: rgba(158,206,106,.12); }
  .issue .asg.todo { color: var(--accent); background: var(--accent-dim); }
  .ctx, .wait-meta { width: 100%; font-size: var(--fs-xs); color: var(--text-muted); margin-left: 23px; }
  /* 대기 항목의 프로젝트 — 경과·재촉 뒤에 붙는다 */
  .wait-meta .chip { margin-left: 8px; vertical-align: 1px; }
  .suggest { display: flex; gap: 6px; align-items: center; width: 100%; margin-left: 23px; font-size: var(--fs-xs); }
  .suggest .act { color: var(--text-muted); }
  .badge-ai {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--ai); background: var(--ai-dim);
    border-radius: 4px; padding: 0 6px;
  }
  .toast {
    position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%);
    background: var(--bg-raised); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 6px 14px; font-size: var(--fs-sm);
    color: var(--text-secondary); box-shadow: var(--shadow-pop);
    display: none; z-index: 9;
  }
  .toast.show { display: block; }
  .toast .spin { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border: 2px solid var(--ai-dim); border-top-color: var(--ai); border-radius: 99px; animation: rot .8s linear infinite; vertical-align: -1px; }
  .elapsed { font-family: var(--font-mono); }
  .elapsed.hot { color: var(--danger); }
  /* 재촉 횟수 — 같은 사람을 세 번 찌르고 있다는 사실이 경과일보다 중요할 때가 있다 */
  .nudge-n {
    margin-left: 8px; font-family: var(--font-mono); font-size: 10px;
    color: var(--ai); background: var(--ai-dim); border-radius: 99px; padding: 1px 7px;
  }

  /* ── 프로젝트 번호 띠
     1~9가 무엇인지는 스크롤과 무관하게 늘 같은 자리에 있어야 한다 — 목록 끝에 한 번 적는
     방식으로는 항목이 쌓이면 화면 밖으로 밀려 결국 아무도 못 본다. */
  .numlegend {
    display: none; flex: none; flex-wrap: wrap; gap: var(--sp-3);
    padding: 6px var(--sp-5);
    border-top: 1px solid var(--border); background: var(--bg-raised);
    font-size: var(--fs-xs); color: var(--text-secondary);
  }
  .numlegend.show { display: flex; }
  .numlegend b { font-family: var(--font-mono); color: var(--accent); margin-right: 5px; }
  .numlegend .ab { font-family: var(--font-mono); color: var(--text-muted); margin-left: 5px; }
  /* 이름 칩에도 같은 번호를 달아 눈으로 익게 한다 (오늘 탭 그룹·대기 행·AI 제안) */
  .chip .pn { font-family: var(--font-mono); font-size: 10px; color: var(--accent); }

  /* 프로젝트 탭 */
  .proj-num { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-muted); flex: none; width: 14px; text-align: right; margin-top: 3px; }
  .proj-repos { width: 100%; font-size: var(--fs-xs); color: var(--text-muted); margin-left: 22px; font-family: var(--font-mono); }
  /* 끝내지 않고 둔 자리 — 경고는 아니지만 눈에 걸려야 한다 */
  .proj-left { width: 100%; font-size: var(--fs-xs); color: var(--warning); margin-left: 22px; }

  /* ── 오늘 일정 타임라인
     축(세로선)은 각 행이 자기 높이만큼 그려 이어 붙인다. 좌표를 소수점(50% - 0.5px)으로 두면
     Windows 배율에서 행마다 반올림이 갈려 선이 두 줄로 어긋나므로 **정수 픽셀**로 고정한다.
     --axis-x = 시각 칸(52) + 간격(8) + 점 중앙(4.5) − 선 두께 절반(0.5) */
  .tl { --axis-x: 64px; margin: 0 var(--sp-2) var(--sp-2); }
  .tl-row {
    position: relative; display: flex; align-items: center;
    gap: var(--sp-2); padding: 3px var(--sp-3) 3px 0;
  }
  .tl-row::before {
    content: ""; position: absolute; left: var(--axis-x); top: 0; bottom: 0;
    width: 1px; background: var(--border); z-index: 0;
  }
  /* 축이 첫 점 위·마지막 점 아래로 삐져나오지 않게 반만 그린다 (점은 행 중앙에 있다) */
  .tl-row:first-child::before { top: 50%; }
  .tl-row:last-child::before { bottom: 50%; }
  .tl-time {
    flex: none; width: 52px; text-align: right;
    font-family: var(--font-mono); font-size: var(--fs-xs);
    color: var(--text-muted); font-variant-numeric: tabular-nums;
  }
  .tl-dot { flex: none; width: 9px; height: 9px; position: relative; }
  /* 점이 축 위에 얹혀 가운데를 가린다 */
  .tl-dot::before {
    content: ""; position: absolute; inset: 0; border-radius: 99px; z-index: 1;
    background: var(--bg-app); border: 1.5px solid var(--text-muted);
  }
  .tl-title { flex: 1; font-size: var(--fs-sm); color: var(--text-primary); }
  .tl-loc { color: var(--text-muted); font-size: var(--fs-xs); }
  .tl-meta {
    flex: none; font-family: var(--font-mono); font-size: var(--fs-xs);
    color: var(--text-muted); font-variant-numeric: tabular-nums;
  }

  /* 지난 것은 물러나고, 진행 중인 것만 채운 점으로 눈에 든다.
     상태 클래스에 tl- 접두사가 붙는 이유: 이 CSS는 전역이라 .next 같은 이름은
     이미 재개 카드의 "다음 액션" 박스가 쓰고 있다(붙이지 않으면 padding·배경이 딸려온다). */
  .tl-row.tl-past { opacity: .4; }
  .tl-row.tl-past .tl-title { text-decoration: line-through; }
  .tl-row.tl-next .tl-dot::before { border-color: var(--accent); }
  .tl-row.tl-next .tl-meta { color: var(--accent); }
  .tl-row.tl-live .tl-dot::before { background: var(--success); border-color: var(--success); }
  .tl-row.tl-live .tl-title { color: var(--success); font-weight: 700; }
  .tl-row.tl-live .tl-meta { color: var(--success); }

  /* "지금" 표시 — 축을 가로지르는 점선 */
  .tl-row.tl-now .tl-time { color: var(--accent); }
  .tl-row.tl-now .tl-dot::before { background: var(--accent); border-color: var(--accent); transform: scale(.6); }
  .tl-nowline {
    flex: 1; display: flex; align-items: center; gap: var(--sp-2);
    font-size: 11px; color: var(--accent); letter-spacing: .06em;
  }
  .tl-nowline::before {
    content: ""; flex: 1; height: 0; border-top: 1px dashed var(--accent); opacity: .45;
  }

  /* 방금 끝났거나 진행 중인 회의 — 후속을 붙일 수 있다는 표식(누르면 M과 같은 일) */
  .tl-follow {
    flex: none; margin-left: 6px; cursor: pointer;
    font-family: var(--font-mono); font-size: 10px;
    color: var(--accent); background: var(--accent-dim);
    border-radius: 99px; padding: 1px 7px;
  }
  .tl-follow:hover { background: rgba(122,162,247,.26); }

  .tl-allday {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: 3px var(--sp-3) 3px 0; margin: 0 var(--sp-2);
  }
  .tl-allday .tl-time { color: var(--text-muted); }
  .tl-allday .tl-title { font-size: var(--fs-sm); }

  /* 일정 머리글은 프로젝트 그룹과 같은 칩 모양을 쓰되 색점이 없다 */
  .group-h .cal-chip { color: var(--text-muted); }

  /* 할 일이 없는 날에도 일정은 보인다 — 그때 빈 화면이 한 화면을 다 먹지 않게 */
  .tl + .empty, .tl-allday + .empty { height: auto; padding: 48px 0; }

  /* 설정 탭 */
  .set-val {
    flex: none; font-family: var(--font-mono); font-size: var(--fs-xs);
    color: var(--accent); background: var(--accent-dim);
    border-radius: 99px; padding: 1px 9px; max-width: 60%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px;
  }
  .set-val.dim { color: var(--text-muted); background: var(--bg-inset); }
  .set-foot { margin: var(--sp-4) var(--sp-3) 0; padding-top: var(--sp-3); border-top: 1px dashed var(--border); }
  .set-foot .ctx { margin-left: 0; font-family: var(--font-mono); }

  .empty {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: var(--sp-2);
    color: var(--text-muted); font-size: var(--fs-sm); text-align: center;
  }
  .empty .big { font-size: 34px; opacity: .35; margin-bottom: var(--sp-1); }

  /* ── 하단 바 */
  footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: var(--sp-2) var(--sp-5);
    border-top: 1px solid var(--border);
    font-size: var(--fs-xs); color: var(--text-muted); flex: none;
  }
  .sync { display: flex; align-items: center; gap: 6px; }
  .sync .led { width: 7px; height: 7px; border-radius: 99px; background: var(--success); box-shadow: 0 0 6px rgba(158,206,106,.6); }
  .sync.off .led { background: var(--warning); box-shadow: 0 0 6px rgba(224,175,104,.6); }
  /* 힌트가 늘어 폭을 넘기면 레이아웃이 밀리는 대신 뒤쪽(관습적인 Esc 등)부터 잘린다 */
  .foot-hints { display: flex; gap: var(--sp-3); flex-wrap: nowrap; overflow: hidden; }
  .foot-hints span { white-space: nowrap; }

  /* ── 재개 카드 */
  .rhead {
    display: flex; align-items: center; gap: var(--sp-3);
    padding: var(--sp-2) 0 var(--sp-3);
  }
  .rhead .back {
    color: var(--text-muted); cursor: pointer; font-size: 18px; line-height: 1;
    width: 26px; height: 26px; border-radius: var(--r-sm);
    display: grid; place-items: center; transition: background .1s;
  }
  .rhead .back:hover { background: var(--bg-hover); color: var(--text-primary); }
  .rhead .pname { font-weight: 700; font-size: var(--fs-lg); display: flex; align-items: center; gap: 9px; }
  .rhead .pname .dot { width: 9px; height: 9px; border-radius: 99px; }
  .rhead .gen-at { margin-left: auto; font-size: var(--fs-xs); color: var(--text-muted); }
  /* 카드 생성 후 쌓인 커밋 수 — 카드가 낡았다는 유일한 객관적 신호다 */
  .rhead .gen-at .stale-n {
    margin-left: 8px; font-family: var(--font-mono);
    color: var(--warning); background: rgba(224,175,104,.12);
    border-radius: 99px; padding: 1px 8px;
  }
  .rbody { display: flex; flex-direction: column; gap: var(--sp-4); }
  .badge-ai {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--ai);
    background: var(--ai-dim); border-radius: 4px; padding: 0 6px;
  }
  .card {
    background: var(--bg-raised); border: 1px solid var(--border);
    border-radius: var(--r-md); padding: var(--sp-4) var(--sp-4);
    display: flex; flex-direction: column; gap: var(--sp-3);
  }
  .card .h {
    font-size: 11px; color: var(--text-muted); letter-spacing: .08em;
    margin-bottom: 4px; display: flex; align-items: center; gap: 6px;
  }
  .card .v { font-size: var(--fs-md); }
  .next {
    background: var(--accent-dim); border-radius: var(--r-sm);
    padding: var(--sp-2) var(--sp-3);
    display: flex; gap: var(--sp-2); align-items: baseline;
  }
  .next .arrow { color: var(--accent); font-weight: 700; flex: none; }
  .sec-h { font-size: 11px; color: var(--text-muted); letter-spacing: .08em; margin-bottom: var(--sp-2); }
  /* gh/glab을 새로 긁는 동안 — 아래 두 단이 이유 없이 늦게 바뀌어 보이지 않게 */
  .sec-h .sync-live { display: inline-flex; align-items: center; gap: 5px; margin-left: 8px; color: var(--ai); }
  .sec-h .sync-live .spin { width: 9px; height: 9px; border-width: 1.5px; }
  .commit {
    display: flex; gap: var(--sp-2); align-items: baseline;
    font-family: var(--font-mono); font-size: var(--fs-xs);
    padding: 3px 0; color: var(--text-secondary);
  }
  .commit .sha { color: var(--warning); flex: none; }
  .commit .when { color: var(--text-muted); margin-left: auto; flex: none; padding-left: var(--sp-3); }
  .issue {
    display: flex; gap: var(--sp-2); align-items: baseline;
    font-size: var(--fs-sm); padding: 5px var(--sp-2); margin: 0 calc(-1 * var(--sp-2));
    color: var(--text-secondary); cursor: pointer; border-radius: var(--r-sm);
    transition: background .1s;
  }
  .issue:hover { background: var(--bg-raised); }
  /* 이슈 탭에서는 목록 안에 서므로 항목 행과 좌우를 맞춘다 (재개 카드 안은 음수 마진) */
  .issue.in-tab { margin: 1px var(--sp-2); padding: 7px var(--sp-3); }
  .issue .num { cursor: pointer; }
  .issue .num:hover { color: var(--accent); }
  .issue.selected { background: var(--accent-dim); box-shadow: inset 2px 0 0 var(--accent); }
  .issue .st { width: 8px; height: 8px; border-radius: 99px; flex: none; align-self: center; background: var(--text-muted); }
  .issue .st.open { background: var(--success); }
  .issue .st.merged { background: var(--ai); }
  .issue .kind {
    font-family: var(--font-mono); font-size: 10px; flex: none;
    border-radius: 4px; padding: 0 4px; color: var(--accent); background: var(--accent-dim);
  }
  .issue .asg.rev { color: var(--ai); background: var(--ai-dim); }
  .issue .asg.draft { color: var(--text-muted); background: var(--bg-inset); }
  .issue .prov { font-family: var(--font-mono); font-size: 10px; flex: none; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; color: var(--text-muted); }
  .issue .num { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-muted); flex: none; }
  .issue .tt { flex: 1; color: var(--text-primary); }
  .issue .asg { flex: none; font-size: 10px; color: var(--warning); background: rgba(224,175,104,.12); border-radius: 4px; padding: 0 5px; }
  .issue .when { color: var(--text-muted); font-size: var(--fs-xs); flex: none; }
  .sync-note { font-size: var(--fs-xs); color: var(--text-muted); margin-top: 6px; }
  .gen-status { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); color: var(--ai); }
  .spin { width: 12px; height: 12px; border: 2px solid var(--ai-dim); border-top-color: var(--ai); border-radius: 99px; animation: rot .8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .skeleton { display: flex; flex-direction: column; gap: 10px; }
  .sk { height: 12px; border-radius: 4px; background: linear-gradient(90deg, var(--bg-inset) 25%, var(--bg-hover) 50%, var(--bg-inset) 75%); background-size: 200% 100%; animation: shim 1.4s infinite; }
  @keyframes shim { to { background-position: -200% 0; } }
  .err { background: rgba(247,118,142,.08); border: 1px solid rgba(247,118,142,.35); border-radius: var(--r-md); padding: var(--sp-3) var(--sp-4); font-size: var(--fs-sm); color: var(--text-secondary); }
  .err .t { color: var(--danger); font-weight: 600; margin-bottom: 2px; }

  /* ── 주간 리뷰 */
  .rv-head { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) 0 var(--sp-3); }
  .rv-head .wk { font-weight: 700; font-size: var(--fs-lg); }
  .rv-head .range { color: var(--text-muted); font-size: var(--fs-xs); min-height: 18px; }
  /* 이번 주 표시 — 주차 숫자와 뒤섞이지 않게 배지로 뗀다 */
  .rv-head .wk .now {
    margin-left: 9px; vertical-align: 2px;
    font-size: 11px; font-weight: 400; font-family: var(--font-mono);
    color: var(--accent); background: var(--accent-dim);
    border-radius: 99px; padding: 1px 8px;
  }
  .rv-head .gen-at { margin-left: auto; font-size: var(--fs-xs); color: var(--text-muted); }
  .rv-nav { display: flex; gap: 2px; }
  .rv-nav span {
    width: 24px; height: 24px; display: grid; place-items: center;
    border-radius: var(--r-sm); color: var(--text-muted); cursor: pointer;
  }
  .rv-nav span:hover { background: var(--bg-hover); color: var(--text-primary); }
  /* 이번 주에서는 오른쪽으로 갈 데가 없다 */
  .rv-nav span.dim { opacity: .25; cursor: default; }
  .rv-nav span.dim:hover { background: none; color: var(--text-muted); }
  .rv-body {
    background: var(--bg-raised); border: 1px solid var(--border);
    border-radius: var(--r-md); padding: var(--sp-4) var(--sp-5) var(--sp-5);
  }
  /* 다음 주를 불러오는 동안의 옛 본문 — 자리를 지키느라 남겨둔 것이라 물러나 있는다 */
  .rv-body.stale { opacity: .4; }
  .rv-body h3 {
    font-size: var(--fs-md); margin: var(--sp-4) 0 var(--sp-2);
    color: var(--accent); font-weight: 700;
  }
  .rv-body h3:first-child { margin-top: 0; }
  .rv-body h4 { font-size: var(--fs-sm); margin: var(--sp-3) 0 var(--sp-1); color: var(--text-secondary); }
  .rv-body p { margin: var(--sp-2) 0; line-height: 1.75; }
  .rv-body ul { margin: var(--sp-2) 0; padding-left: 20px; }
  .rv-body li { margin: 5px 0; line-height: 1.7; }
  .rv-body strong { color: var(--text-primary); font-weight: 700; }
  .rv-body blockquote {
    margin: 0 0 var(--sp-3); padding: 6px 12px; font-size: var(--fs-xs);
    color: var(--text-muted); background: var(--bg-inset); border-radius: var(--r-sm);
  }
  .rv-file {
    margin-top: var(--sp-3); font-size: var(--fs-xs); color: var(--text-muted);
    display: flex; align-items: center; gap: 6px; cursor: pointer;
  }
  .rv-file:hover { color: var(--accent); text-decoration: underline; }

  /* ── 전체 키맵 (?)
     하단 힌트를 네 칸으로 줄인 대신 나머지 키는 여기서 한 번에 본다 —
     힌트가 열 칸을 넘어가면 결국 아무것도 읽히지 않는다. */
  #keys {
    display: none; position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(560px, calc(100% - 32px)); max-height: 78vh; overflow-y: auto;
    background: var(--bg-raised); border: 1px solid var(--border-focus);
    border-radius: var(--r-md); padding: var(--sp-4) var(--sp-5) var(--sp-5);
    box-shadow: var(--shadow-pop); z-index: 11;
  }
  #keys.show { display: block; }
  #keys .kh { display: flex; align-items: baseline; font-weight: 700; margin-bottom: var(--sp-3); }
  #keys .kh span { margin-left: auto; font-size: var(--fs-xs); font-weight: 400; color: var(--text-muted); }
  #keys .kbody { display: grid; grid-template-columns: 76px 1fr; gap: var(--sp-2) var(--sp-3); align-items: baseline; }
  #keys .g { font-size: var(--fs-xs); color: var(--text-muted); }
  #keys .ks { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: var(--fs-sm); color: var(--text-secondary); }
  #keys .ks span { white-space: nowrap; }

  /* ── 입력 다이얼로그 (공용) */
  #dlg {
    display: none; position: fixed; left: 50%; top: 38%; transform: translateX(-50%);
    width: 440px; background: var(--bg-raised); border: 1px solid var(--border-focus);
    border-radius: var(--r-md); padding: var(--sp-4);
    box-shadow: var(--shadow-pop); z-index: 10;
  }
  #dlg.show { display: block; }
  #dlg label { font-size: var(--fs-xs); color: var(--text-muted); display: block; margin-bottom: 6px; }
  #dlg input {
    width: 100%; background: var(--bg-inset); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 7px 11px; color: var(--text-primary);
    font-family: var(--font-sans); font-size: var(--fs-md); outline: none;
  }
  #dlg input:focus { border-color: var(--border-focus); }
</style>
</head>
<body>
  <div class="app">
    <header>
      <span class="title">WHENWORK</span>
      <nav class="tabs" id="tabs"></nav>
      <span class="date" id="date"></span>
    </header>
    <div class="search" id="search">
      <span class="ico">/</span>
      <input id="searchIn" type="text" maxlength="80" placeholder="제목 · 메모 · 프로젝트 · 대기 상대">
      <span class="cnt" id="searchCnt"></span>
    </div>
    <div class="subtabs" id="subtabs"></div>
    <div class="body" id="body" tabindex="-1"></div>
    <div class="numlegend" id="numlegend"></div>
    <footer>
      <span class="sync" id="sync"><span class="led"></span><span id="syncText">동기화됨</span></span>
      <span class="foot-hints" id="hints"></span>
    </footer>
  </div>
  <div id="keys">
    <div class="kh">키<span>? · Esc 로 닫기</span></div>
    <div class="kbody" id="keysBody"></div>
  </div>
  <div id="dlg">
    <label id="dlgLabel"></label>
    <input id="dlgIn" type="text" maxlength="500">
  </div>
  <div class="toast" id="toast"></div>
<script src="icons.js"></script>
<script src="md.js"></script>
<script src="view.js"></script>
<script src="today.js"></script>
</body>
</html>
